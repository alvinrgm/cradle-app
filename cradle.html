<title>Cradle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF6EF">
<meta name="cradle-version" content="1.6.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap">
<style>
/* Layout: one-thumb phone app. Glance up (status, totals), act down (dock + tab bar in the bottom third).
   Tokens come from the Cradle Figma file. Night mode is a third, amber-only palette. */
:root{
  --bg:#FBF6EF; --card:#FFFFFF; --ink:#2B2733; --sub:#6B6476; --line:#EDE6DC; --scrim:rgba(43,39,51,.42);
  --feed:#EE8F62; --feed-ink:#A9512A; --feed-soft:#FDE8DC;
  --sleep:#7C83E8; --sleep-ink:#4A51BE; --sleep-soft:#E6E7FB;
  --diaper:#4FAE88; --diaper-ink:#2A7558; --diaper-soft:#DDF2E8;
  --poop:#9A6B4F; --poop-soft:#F1E4DA; --pee:#D9B23A; --pee-soft:#FBF1D2;
  --plan:#D9A42E; --plan-ink:#80590C; --plan-soft:#FBF0D3;
  --danger:#D4523C; --danger-ink:#A63623; --danger-soft:#FCE3DD;
  --btn:#2B2733; --btn-ink:#FFFFFF; --focus:#4A51BE;
  --feed-btn:#EE8F62; --feed-btn-ink:#241F2B; --sleep-btn:#5F66D6; --sleep-btn-ink:#FFFFFF; --diaper-btn:#4FAE88; --diaper-btn-ink:#14121B; --danger-btn:#BF4330; --danger-btn-ink:#FFFFFF;
  --f-display:"Fraunces", Georgia, "Times New Roman", serif;
  --f-body:"DM Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-s:12px; --r-m:18px; --r-l:26px;
  --sp1:4px; --sp2:8px; --sp3:12px; --sp4:16px; --sp5:24px; --sp6:32px;
  --dock-h:0px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14121B; --card:#211E2B; --ink:#EEEAF3; --sub:#A69DB2; --line:#2F2B3B; --scrim:rgba(0,0,0,.6);
  --feed:#EE8F62; --feed-ink:#F4AA86; --feed-soft:#3A2922;
  --sleep:#8C92EE; --sleep-ink:#B2B6F6; --sleep-soft:#272948;
  --diaper:#4FAE88; --diaper-ink:#86D3B3; --diaper-soft:#1C372D;
  --poop:#C49478; --poop-soft:#382A22; --pee:#E2C15A; --pee-soft:#3A3219;
  --plan:#E2B54B; --plan-ink:#EAC86F; --plan-soft:#352D18;
  --danger:#E8735E; --danger-ink:#F29A88; --danger-soft:#43231D;
  --feed-btn:#EE8F62; --feed-btn-ink:#14121B; --sleep-btn:#8C92EE; --sleep-btn-ink:#14121B; --diaper-btn:#4FAE88; --diaper-btn-ink:#14121B; --danger-btn:#E8735E; --danger-btn-ink:#14121B;
  --btn:#EEEAF3; --btn-ink:#14121B; --focus:#B2B6F6; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#14121B; --card:#211E2B; --ink:#EEEAF3; --sub:#A69DB2; --line:#2F2B3B; --scrim:rgba(0,0,0,.6);
  --feed:#EE8F62; --feed-ink:#F4AA86; --feed-soft:#3A2922;
  --sleep:#8C92EE; --sleep-ink:#B2B6F6; --sleep-soft:#272948;
  --diaper:#4FAE88; --diaper-ink:#86D3B3; --diaper-soft:#1C372D;
  --poop:#C49478; --poop-soft:#382A22; --pee:#E2C15A; --pee-soft:#3A3219;
  --plan:#E2B54B; --plan-ink:#EAC86F; --plan-soft:#352D18;
  --danger:#E8735E; --danger-ink:#F29A88; --danger-soft:#43231D;
  --feed-btn:#EE8F62; --feed-btn-ink:#14121B; --sleep-btn:#8C92EE; --sleep-btn-ink:#14121B; --diaper-btn:#4FAE88; --diaper-btn-ink:#14121B; --danger-btn:#E8735E; --danger-btn-ink:#14121B;
  --btn:#EEEAF3; --btn-ink:#14121B; --focus:#B2B6F6; color-scheme:dark;
}
/* Night mode: dim amber only. No white, no blue light. Overrides every theme. */
html.night:root{
  --bg:#0D0A07; --card:#18120C; --ink:#D69B5E; --sub:#A0805A; --line:#2A2016; --scrim:rgba(0,0,0,.7);
  --feed:#C4874B; --feed-ink:#E0A66A; --feed-soft:#24190F;
  --sleep:#A87A47; --sleep-ink:#D9A064; --sleep-soft:#211710;
  --diaper:#A0844E; --diaper-ink:#D3AC68; --diaper-soft:#1F1910;
  --poop:#A07148; --poop-soft:#22180F; --pee:#B89452; --pee-soft:#231B0F;
  --plan:#B98A45; --plan-ink:#D9A35E; --plan-soft:#22190E;
  --danger:#C9693F; --danger-ink:#E08A5E; --danger-soft:#2A170D;
  --feed-btn:#C4874B; --feed-btn-ink:#0D0A07; --sleep-btn:#A87A47; --sleep-btn-ink:#0D0A07; --diaper-btn:#A0844E; --diaper-btn-ink:#0D0A07; --danger-btn:#C9693F; --danger-btn-ink:#0D0A07;
  --btn:#3A2A19; --btn-ink:#E8B47A; --focus:#E0A66A; color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.45 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- shell ---------- */
#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
.view{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:var(--sp4) calc(var(--dock-h) + 96px)}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sub)}
.h1{font:600 30px/1.1 var(--f-display);letter-spacing:-.01em}
.h2{font:600 22px/1.15 var(--f-display)}
.h3{font-size:17px;font-weight:600}
.sub{color:var(--sub);font-size:14px}
.small{font-size:13px}
.stack{display:flex;flex-direction:column;gap:var(--sp3)}
.row{display:flex;align-items:center;gap:var(--sp3)}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--r-m);padding:var(--sp4)}
.section{display:flex;flex-direction:column;gap:var(--sp3);margin-top:var(--sp5)}
.section > .row h2{flex:1}

.topbar{display:flex;align-items:flex-start;gap:var(--sp3);margin-bottom:var(--sp4)}
.topbar .grow{display:flex;flex-direction:column;gap:2px}
.iconbtn{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--card);flex:none}
.iconbtn:active{transform:scale(.94)}
.ic{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}

/* status pill */
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--sub);font-weight:500}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--diaper)}
.sync.busy i{background:var(--plan);animation:pulse 1s infinite}
.sync.off i{background:var(--danger)}
@keyframes pulse{50%{opacity:.3}}

/* ---------- Today ---------- */
.hero{display:flex;flex-direction:column;gap:6px}
.hero .big{font:600 48px/1 var(--f-display);letter-spacing:-.02em}
.meter{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:3px;background:var(--sleep)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--sp2)}
.stat{background:var(--card);border-radius:var(--r-s);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:left}
.stat b{font:600 20px/1.15 var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:12px;color:var(--sub)}
.stat.feed b{color:var(--feed-ink)} .stat.diaper b{color:var(--diaper-ink)} .stat.sleep b{color:var(--sleep-ink)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:6px;padding:3px 7px;white-space:nowrap}
.tag.book{background:var(--plan-soft);color:var(--plan-ink)}
.tag.tip{background:var(--sleep-soft);color:var(--sleep-ink)}
.tag.aap{background:var(--diaper-soft);color:var(--diaper-ink)}
.tag.claude{background:var(--line);color:var(--sub)}
.advice{display:flex;flex-direction:column;gap:8px}
.advice p{font-size:15px}

.flag{background:var(--danger-soft);border-radius:var(--r-m);padding:var(--sp4);display:flex;flex-direction:column;gap:10px}
.flag h3{font:600 20px/1.2 var(--f-display);color:var(--ink)}
.flag .ico{width:40px;height:40px;border-radius:50%;background:var(--danger);display:grid;place-items:center;color:var(--card)}
.okline{background:var(--diaper-soft);color:var(--diaper-ink);border-radius:var(--r-s);padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px}

.timeline{display:flex;flex-direction:column}
.tl{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;width:100%}
.tl:last-child{border-bottom:0}
.tl .t{width:68px;flex:none;color:var(--sub);font-size:13px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.d-feed{background:var(--feed)} .d-sleep{background:var(--sleep)} .d-diaper{background:var(--diaper)} .d-note{background:var(--sub)} .d-spit{background:var(--danger)}

/* dock: type box + three tiles, sits above the tab bar */
.dock{position:absolute;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom, 0px));
  padding:10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px));
  background:linear-gradient(to bottom, transparent, var(--bg) 18px);display:flex;flex-direction:column;gap:10px;z-index:5}
.typebox{display:flex;gap:8px;align-items:center}
.typebox input{flex:1;min-width:0;height:52px;border-radius:26px;border:1.5px solid var(--line);background:var(--card);padding:0 18px;font-size:16px}
.typebox input::placeholder{color:var(--sub)}
.sendbtn{width:52px;height:52px;border-radius:50%;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.sendbtn[aria-busy="true"]{opacity:.6}
.micbtn{width:52px;height:52px;border-radius:50%;background:var(--card);border:1.5px solid var(--line);color:var(--ink);display:grid;place-items:center;flex:none}
.micbtn:active{transform:scale(.94)}
.dock.listening .typebox .micbtn{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.dock.listening .typebox input{border-color:var(--btn)}
.micmini{display:none;position:absolute;top:2px;right:12px;width:44px;height:44px}
html.hand-left .micmini{right:auto;left:12px}
.dock.mini .micmini{display:grid}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{height:44px;padding:0 14px;border-radius:18px;background:var(--card);border:1.5px solid var(--line);font-size:14px;font-weight:500;white-space:nowrap;flex:none}
.chip[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{position:relative;border-radius:var(--r-l);min-height:132px;padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .ring{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile b{font-size:18px;font-weight:600}
.tile span{font-size:12px;color:var(--sub);text-align:center;line-height:1.25}
.tile.feed{background:var(--feed-soft)} .tile.feed .ring{background:var(--feed)}
.tile.sleep{background:var(--sleep-soft)} .tile.sleep .ring{background:var(--sleep)}
.tile.diaper{background:var(--diaper-soft)} .tile.diaper .ring{background:var(--diaper)}
.tile.running{outline:3px solid var(--sleep);outline-offset:-3px}
.tile.feed.running{outline-color:var(--feed)}
html.night .tile .ring{color:var(--bg)}
.tilewrap{position:relative;min-width:0;display:flex}
.tilewrap .tile{flex:1;width:100%}
.tilewrap .more{position:absolute;top:4px;right:4px;left:auto;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--sub)}
.dockhint{font-size:12px;color:var(--sub);text-align:center}

/* tab bar */
.tabs{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);display:grid;grid-template-columns:repeat(4,1fr);
  padding:6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px));
  border-top:1px solid var(--line)}
.tab{text-decoration:none;height:60px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:500;color:var(--sub);border-radius:16px}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] .tabic{background:var(--btn);color:var(--btn-ink)}
.tabic{width:44px;height:30px;border-radius:15px;display:grid;place-items:center}

/* ---------- buttons ---------- */
.btn{min-height:56px;border-radius:28px;padding:0 22px;display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:17px;background:var(--btn);color:var(--btn-ink);transition:transform .08s,opacity .1s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.big{min-height:72px;font-size:20px;border-radius:36px}
.btn.ghost{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
.btn.feed{background:var(--feed-btn);color:var(--feed-btn-ink)} .btn.sleep{background:var(--sleep-btn);color:var(--sleep-btn-ink)} .btn.diaper{background:var(--diaper-btn);color:var(--diaper-btn-ink)}
.btn.danger{background:var(--danger-btn);color:var(--danger-btn-ink)}
.btn.quiet{background:none;color:var(--danger-ink);min-height:48px}
.btn[aria-busy="true"]{opacity:.6;pointer-events:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link{color:var(--sleep-ink);font-weight:600;min-height:44px;display:inline-flex;align-items:center}

/* ---------- lists ---------- */
.list{background:var(--card);border-radius:var(--r-m);overflow:hidden}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:60px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li .meta{font-size:13px;color:var(--sub)}
.li .val{color:var(--sub);font-size:14px;text-align:right}
.badge{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff}
html.night .badge{color:var(--bg)}
.b-feed{background:var(--feed)} .b-sleep{background:var(--sleep)} .b-diaper{background:var(--diaper)} .b-poop{background:var(--poop)} .b-pee{background:var(--pee)} .b-note{background:var(--sub)} .b-spit{background:var(--danger)}
.who{width:22px;height:22px;border-radius:50%;font-size:11px;font-weight:700;display:inline-grid;place-items:center;color:#fff;vertical-align:middle;flex:none}
.days{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.days::-webkit-scrollbar{display:none}
.daybtn{min-width:52px;height:60px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:var(--sub);flex:none}
.daybtn b{font-size:18px;color:var(--ink)}
.daybtn[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
.daybtn[aria-pressed="true"] b{color:var(--btn-ink)}
.seg{display:flex;background:var(--card);border-radius:16px;padding:4px;gap:4px}
.seg button{flex:1;min-height:48px;border-radius:12px;font-weight:600;color:var(--sub)}
.seg button[aria-pressed="true"]{background:var(--feed-btn);color:var(--feed-btn-ink)}

.seg.dark button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink)}
html.night .seg button[aria-pressed="true"]{color:var(--bg)}
.empty{padding:28px 18px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;color:var(--sub)}
.empty .h3{color:var(--ink)}
.skel{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sh 1.2s infinite;border-radius:12px}
@keyframes sh{to{background-position:-200% 0}}

/* ---------- Plan ---------- */
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.rung{min-height:64px;border-radius:14px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px;text-align:center}
.rung b{font-size:14px} .rung span{font-size:11px;color:var(--sub);line-height:1.2}
.rung[aria-pressed="true"]{background:var(--plan);color:#fff} .rung[aria-pressed="true"] span{color:#fff}
.rung.current{box-shadow:inset 0 0 0 2px var(--plan)}
html.night .rung[aria-pressed="true"],html.night .rung[aria-pressed="true"] span{color:var(--bg)}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.tick{width:26px;height:26px;border-radius:50%;flex:none;display:grid;place-items:center;border:2px solid var(--line);color:transparent}
.tick.on{background:var(--diaper);border-color:var(--diaper);color:#fff}
.tick.part{border-color:var(--plan);color:var(--plan)}
.rule{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.rule:last-child{border-bottom:0}
.rule .tag{margin-top:2px}
.strip{display:grid;grid-template-columns:44px 1fr;gap:6px 8px;align-items:center;font-size:12px;color:var(--sub)}
.bar{position:relative;height:18px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0}
.bar .s{background:var(--sleep);opacity:.85}
.bar .f{background:var(--feed);width:3px;margin-left:-1px}
.bar .g{background:var(--plan);width:3px;margin-left:-1px}
.bar .night{background:var(--sleep-soft)}
.axis{display:flex;justify-content:space-between;font-size:11px;color:var(--sub);padding-left:52px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.claude-read{white-space:pre-wrap;font-size:15px}

/* ---------- sheets ---------- */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;opacity:0;transition:opacity .18s}
.scrim.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:520px;margin:0 auto;background:var(--bg);border-radius:28px 28px 0 0;
  max-height:92%;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0;flex:none}
.sheet .sh-head{display:flex;align-items:center;gap:10px;padding:10px max(20px, env(safe-area-inset-right, 0px)) 6px max(20px, env(safe-area-inset-left, 0px))}
.sheet .sh-body{overflow-y:auto;padding:8px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:14px}
.bignum{font:600 88px/1 var(--f-display);letter-spacing:-.03em;text-align:center}
.bignum small{font:500 22px var(--f-body);color:var(--sub);margin-left:4px;letter-spacing:0}
.stepper{display:grid;grid-template-columns:72px 1fr 72px;align-items:center;gap:8px}
.stepper .iconbtn{width:72px;height:72px;background:var(--feed-soft);color:var(--feed-ink)}
.presets{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.presets button{height:52px;border-radius:14px;background:var(--card);font-weight:600;border:2px solid transparent}
.presets button[aria-pressed="true"]{border-color:var(--feed);background:var(--feed-soft);color:var(--feed-ink)}
.field{display:flex;flex-direction:column;gap:4px;background:var(--card);border-radius:14px;padding:10px 14px}
.field label,.field .lbl{font-size:12px;color:var(--sub);font-weight:500}
.field input,.field select,.field textarea{border:0;background:none;font-size:17px;padding:2px 0;min-height:32px;width:100%;min-width:0}
.field textarea{resize:vertical;min-height:64px}

<script>
"use strict";
/* ============================================================
   Cradle core: state, storage, time math, derived numbers, parser
   ============================================================ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const MIN = 60e3, HR = 36e5, DAY = 864e5, OZ = 29.5735, LB = 453.592;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const ls = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem(k); } catch {} },
};

const IC = {
  moon: '<path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>',
  bottle: '<path d="M9 2h6M10 2v3L8 8v12a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2V8l-2-3V2M8 12h8"/>',
  diaper: '<path d="M3 7h18v3a9 9 0 0 1-18 0z"/><path d="M8 7v2M16 7v2"/>',
  home: '<path d="M3 11l9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
  undo: '<path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/>',
  check: '<path d="M5 12l5 5L20 7"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
  chevron: '<path d="M9 6l6 6-6 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  drop: '<path d="M12 3s-6 6.5-6 11a6 6 0 0 0 12 0c0-4.5-6-11-6-11z"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/>',
  send: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  alert: '<path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17h.01"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/>',
  phone: '<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/>',
  more: '<circle cx="5" cy="12" r="1.2"/><circle cx="12" cy="12" r="1.2"/><circle cx="19" cy="12" r="1.2"/>',
  edit: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/>',
  download: '<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/>',
  scale: '<path d="M4 20h16l-2-12H6z"/><path d="M9 8a3 3 0 0 1 6 0"/>',
  hand: '<path d="M8 13V5a1.5 1.5 0 0 1 3 0v6M11 10V4a1.5 1.5 0 0 1 3 0v6M14 10V5.5a1.5 1.5 0 0 1 3 0V14a7 7 0 0 1-7 7c-2.5 0-4-1-5.5-3L3 15a1.5 1.5 0 0 1 2.5-1.5L8 16"/>',
  book: '<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
  sparkle: '<path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/>',
  chat: '<path d="M4 5h16v11H9l-5 4z"/>',
  people: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5a5 5 0 0 1 5.5 5"/>',
  lock: '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>',
  pump: '<path d="M4 4h16l-6 7v6l-4 3v-9z"/>',
  spit: '<path d="M12 3c4 3 6 6 6 9a6 6 0 0 1-12 0c0-3 2-6 6-9z"/><path d="M9 13h6"/>',
  note: '<path d="M5 4h10l4 4v12H5z"/><path d="M14 4v5h5M8 13h8M8 17h5"/>',
};
const icon = (n, cls = "") => `<svg class="ic ${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n] || ""}</svg>`;

/* ---------------- state ---------------- */
const DEFAULT_PROFILE = {
  name: "", birth_date: "", pronoun: "they", feeding: "both", bottle_ml_default: 150, units: "ml",
  day_start: "08:00", bedtime: "20:00", sleep_place: "bassinet", pediatrician: { name: "", phone: "" },
};
const DEFAULT_PREFS = { hand: "right", theme: "auto", dock: "full", night: "auto", vibrate: true, seenIntro: false };
const S = {
  ready: false, slow: false, backend: "none",
  profile: null, plan: null, events: new Map(), checks: new Map(), flags: new Map(),
  got: { profile: false, plan: false, events: false },
  me: null, people: {}, prefs: Object.assign({}, DEFAULT_PREFS, ls.get("cradle.prefs", {})),
  demo: !!ls.get("cradle.demo", false), demoData: null,
  pending: 0, failed: 0,
  route: "today", logDay: null, logFilter: "all", planPhase: null, claudeRead: null,
  ver: 0,
};
const D = () => (S.demo && S.demoData ? S.demoData : S);
const prof = () => {
  const p = Object.assign({}, DEFAULT_PROFILE, D().profile || {});
  p.pediatrician = Object.assign({ name: "", phone: "" }, p.pediatrician || {});
  return p;
};
const planDoc = () => Object.assign({ phase: 1, phase_started_at: null, history: [] }, D().plan || {});

/* ---------------- capabilities + storage ---------------- */
const B = { db: null, user: null, sample: null, downloads: null };
async function useCap(name) {
  try { return window.claude && window.claude.use ? await window.claude.use(name) : null; } catch { return null; }
}

const LOCAL_KEY = "cradle.local";
function localLoad() {
  const L = ls.get(LOCAL_KEY, null) || { profile: null, plan: null, events: {}, checks: {}, flags: {} };
  S.profile = L.profile; S.plan = L.plan;
  S.events = new Map(Object.entries(L.events || {}));
  S.checks = new Map(Object.entries(L.checks || {}));
  S.flags = new Map(Object.entries(L.flags || {}));
}
function localSave() {
  ls.set(LOCAL_KEY, {
    profile: S.profile, plan: S.plan,
    events: Object.fromEntries(S.events), checks: Object.fromEntries(S.checks), flags: Object.fromEntries(S.flags),
  });
}

function docAt(target, path) {
  const [c, id] = path.split("/");
  if (path === "baby/profile") return target.profile;
  if (path === "plan/current") return target.plan;
  const m = { events: target.events, checks: target.checks, flags: target.flags }[c];
  return m ? m.get(id) ?? null : undefined;
}
function applyDoc(target, path, data) {
  const [c, id] = path.split("/");
  if (path === "baby/profile") target.profile = data;
  else if (path === "plan/current") target.plan = data;
  else if (c === "events") data ? target.events.set(id, data) : target.events.delete(id);
  else if (c === "checks") data ? target.checks.set(id, data) : target.checks.delete(id);
  else if (c === "flags") data ? target.flags.set(id, data) : target.flags.delete(id);
}

/* Outbox: every shared write is recorded on this phone first and cleared when the store confirms it.
   A write that never confirmed (offline at 3 am, app closed) is replayed on next open. Writes are full-document sets, so replay is safe. */
const outbox = {
  all() { return ls.get("cradle.outbox", {}); },
  put(path, data) { const o = this.all(); o[path] = { data, at: Date.now() }; ls.set("cradle.outbox", o); },
  done(path) { const o = this.all(); delete o[path]; ls.set("cradle.outbox", o); },
};

async function write(path, data) { // data === null deletes
  S.ver++;

    try { await run(); }

      : e && (e.code === "not_granted" || e.code === "revoked") ? "You can view this log but not change it. Ask whoever shared it for edit access."
      : "Couldn't save that yet. It's kept on this phone and will retry.";

}

async function submitText(text, o = {}) {
  text = (text || "").trim(); if (!text) return;

      const more = fromClaude(res);

  }

    { label: "Undo", icon: "undo", fn: () => { created.forEach(id => write("events/" + id, null)); before.forEach(([id, e]) => write("events/" + id, restamp(e))); toast("Removed"); } },
  ].filter(Boolean), { ms: 8000 });
}
function claudeParsePrompt(text) {
  const now = new Date();
  return `You turn a tired parent's shorthand baby log into JSON. Local time now: ${now.toString()}.
Baby feeds by ${prof().feeding}; usual bottle ${prof().bottle_ml_default} ml. Units shown to parent: ${prof().units}.
Text: """${text}"""
Return ONLY JSON: {"entries":[{"type":"feed|pump|diaper|sleep|wake|spit|note","time":"HH:MM 24h or null for now","end":"HH:MM or null","kind":"bottle|breast","ml":number|null,"left_min":number|null,"right_min":number|null,"pee":bool,"poop":bool,"forceful":bool,"pump_minutes":number|null,"left_ml":number|null,"right_ml":number|null,"note":string|null}],"unclear":[strings you could not read]}
"pump" is the parent pumping breast milk: ml is the amount pumped (convert oz to ml at 29.57), left_ml/right_ml if given per side. "wake" means the baby woke up (ends the current sleep). Never invent amounts the text doesn't give; leave ml null. Times are the most recent past occurrence.`;
}
function fromClaude(res) {

  const at = s => { if (!s) return Date.now(); const m = String(s).match(/(\d{1,2}):(\d{2})/); return m ? resolveClock(+m[1], +m[2], null, Date.now()) ?? Date.now() : Date.now(); };

  for (const x of res.entries) {
    const t = at24(x.time);
    if (x.type === "feed") {
      if (x.kind === "breast") { const l = +x.left_min || 0, r = +x.right_min || 0, tot = (l + r || 15) * MIN; out.entries.push({ type: "feed", start_at: t - (x.time ? 0 : tot), end_at: t - (x.time ? 0 : tot) + tot, feed: { kind: "breast", l_sec: l * 60, r_sec: r * 60, side: l && r ? "both" : r ? "R" : "L" } }); }
      else out.entries.push({ type: "feed", start_at: t, end_at: null, feed: { kind: "bottle", ml: Math.round(+x.ml || lastBottleMl() || prof().bottle_ml_default), milk: null } });
    } else if (x.type === "diaper") out.entries.push({ type: "diaper", start_at: t, diaper: { pee: !!x.pee || !x.poop, poop: !!x.poop } });
    else if (x.type === "sleep") out.entries.push({ type: "sleep", start_at: t, end_at: x.end ? at24(x.end) : null });
    else if (x.type === "wake") { const rs = runningSleep(); if (rs) out.entries.push({ type: "wake", end_at: t, target: rs }); else out.unclear.push("up"); }
    else if (x.type === "pump") { const l = x.left_ml != null ? Math.round(+x.left_ml) : null, r = x.right_ml != null ? Math.round(+x.right_ml) : null, m = +x.pump_minutes || 0; out.entries.push({ type: "pump", start_at: t - m * MIN, end_at: t, pump: { ml: l != null || r != null ? (l || 0) + (r || 0) : x.ml != null ? Math.round(+x.ml) : null, l_ml: l, r_ml: r } }); }
    else if (x.type === "spit") out.entries.push({ type: "spit", start_at: t, spit: { forceful: !!x.forceful } });
    else if (x.type === "note" && x.note) out.entries.push({ type: "note", start_at: t, note: String(x.note).slice(0, 500) });
  }
  out.unclear = out.unclear.concat(Array.isArray(res.unclear) ? res.unclear.map(String) : []);
  return out;
}

  const two = n => String(n).padStart(2, "0"), stamp = d => { const x = new Date(d); return `${x.getFullYear()}${two(x.getMonth() + 1)}${two(x.getDate())}T${two(x.getHours())}${two(x.getMinutes())}00`; };
  const now = new Date(), utc = `${now.getUTCFullYear()}${two(now.getUTCMonth() + 1)}${two(now.getUTCDate())}T${two(now.getUTCHours())}${two(now.getUTCMinutes())}00Z`;
  const name = p.name || "Baby", ev = [];

  if (ph >= 2) targetFeeds(ds).forEach((t, i) => add(t, `Feed ${name} (${i + 1} of 4)`, "Cradle: the book's four daytime feeds, four hours apart. Open Cradle to log it.", 30));
  else add(ds, `Start the day: feed ${name}`, "Cradle: a steady start time anchors the day.", 15);
  add(bedOf(ds) - 30 * MIN, `Start ${name}'s bedtime routine`, "Cradle: bath, feed, down by bedtime.", 30);
  return ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//Cradle//EN", "CALSCALE:GREGORIAN", `X-WR-CALNAME:Cradle · ${name}`, ...ev, "END:VCALENDAR"].join("\r\n");
}

/* ---------- CSV import (1.5.0): Huckleberry history, or a Cradle export ----------
